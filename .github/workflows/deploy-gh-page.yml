name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual runs from Actions UI

permissions:
  contents: write # required so deploy step can push to `gh-pages`

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    concurrency:
      group: gh-pages-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build step for static site
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Optional: Custom commit message
          commit_message: 'Deploy: 🚀 GitHub Pages via GitHub Actions'
          # Force orphaned branch
          force_orphan: true
